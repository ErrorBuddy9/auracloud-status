name: AuraCloud Node Scanner

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs automatically every 5 minutes 24/7
  workflow_dispatch:        # Enables manual execution button

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Execute scanner
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python scanner.py

      - name: Commit and push status.json
        run: |
          git config local user.email "action@github.com"
          git config local user.name "GitHub Action"
          git add status.json
          git commit -m "auto: update status telemetry" || exit 0
          git push
