<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraCloud Hostings™ - Status</title>
    <link rel="icon" type="image/webp" href="static/logo.webp">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Inter:wght@400;700;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --up: #00e676; --down: #ff1744; --maint: #ffb300; --nodata: #222533; --blue: #4facfe; --purple: #f093fb; }
        
        * { box-sizing: border-box; }

        body { 
            margin: 0; font-family: 'Inter', sans-serif; background: #060714; color: white; 
            min-height: 100vh; padding: 40px 0; overflow-y: auto; display: flex; 
            flex-direction: column; align-items: center;
            
            /* Page scale reduced to 80% */
            zoom: 80%;
        }

        @supports not (zoom: 80%) {
            body {
                transform: scale(0.8);
                transform-origin: top center;
            }
        }
        
        .blob-bg { position: fixed; width: 800px; height: 800px; border-radius: 50%; filter: blur(140px); z-index: -1; opacity: 0.15; }
        .b1 { background: var(--blue); top: -20%; left: -10%; }
        .b2 { background: var(--purple); bottom: -20%; right: -10%; }

        .main-container { width: 92%; max-width: 850px; position: relative; z-index: 1; }
        
        .glass-panel { 
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(50px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 40px; padding: 40px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.6); margin-bottom: 30px;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; }
        
        /* Clean logo layout without box background */
        .logo { 
            width: 55px; 
            height: 55px; 
            object-fit: contain; 
            background: transparent; 
            border: none; 
            box-shadow: none; 
        }

        /* Modern bold & rounded title typography */
        .brand-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 800;
            font-size: 1.85rem;
            margin: 0;
            letter-spacing: -0.02em;
            color: #ffffff;
            line-height: 1.1;
        }
        
        .monitor-card { 
            background: rgba(0,0,0,0.4); border-radius: 28px; padding: 25px; 
            border: 1px solid rgba(255,255,255,0.03); margin-bottom: 24px;
        }
        
        .node-title { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.25rem; 
            font-weight: 800; 
            margin: 0; 
            letter-spacing: -0.01em; 
        }

        .uptime-val { font-size: 0.8rem; font-weight: 900; color: var(--up); background: rgba(0,230,118,0.1); padding: 6px 14px; border-radius: 9999px; }

        .timeline, .history-timeline { display: flex; gap: 3px; height: 60px; margin: 12px 0; }
        
        .bar { flex: 1; border-radius: 2px; background: var(--nodata); position: relative; transition: 0.2s; cursor: crosshair; }
        .bar:hover { transform: scaleY(1.15); z-index: 10; filter: brightness(1.3); }
        
        .bar.up { background: var(--up); }
        .bar.down { background: var(--down); }
        .bar.maintenance { background: var(--maint); }
        
        .bar:hover::after {
            content: attr(data-label); position: absolute; bottom: 115%; left: 50%; transform: translateX(-50%);
            background: #000; padding: 10px 15px; border-radius: 8px; font-size: 0.65rem; 
            white-space: pre; border: 1px solid rgba(255,255,255,0.1); z-index: 100;
            font-family: 'Courier Prime'; color: #fff;
        }

        .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 18px; }
        .section-label { font-size: 0.6rem; font-weight: 900; opacity: 0.4; text-transform: uppercase; letter-spacing: 1.5px; }
        .history-uptime-text { font-size: 0.8rem; font-weight: 900; color: var(--up); letter-spacing: 0.5px; }

        .advisory-wrapper {
            margin-top: 40px;
        }

        /* Increased vertical separation between label and notes container */
        .admin-box { 
            padding: 22px 25px; background: rgba(0,0,0,0.2); border-left: 3px solid var(--blue); 
            border-radius: 12px; font-family: 'Courier Prime'; color: #aab2c0; 
            font-size: 0.85rem; line-height: 1.6; min-height: 50px; 
            margin-top: 32px; 
        }

        #clock { font-family: 'Courier Prime'; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="blob-bg b1"></div><div class="blob-bg b2"></div>

    <div class="main-container">
        <div class="glass-panel">
            <div class="header">
                <div style="display: flex; align-items: center; gap: 18px;">
                    <img src="static/logo.webp" class="logo" onerror="this.src='https://placehold.co/100x100/000/fff?text=AC'">
                    <div>
                        <h1 class="brand-title">AuraCloud Status</h1>
                        <span id="global-status-wrap" style="font-size: 0.7rem; font-weight: 800; text-transform: uppercase; margin-top: 4px; display: inline-block;">
                            <span id="status-text">Connecting...</span>
                        </span>
                    </div>
                </div>
                <div style="text-align: right;">
                    <div id="clock" style="font-weight:900; font-size:1.1rem;">00:00:00</div>
                    <div style="font-size: 0.55rem; opacity: 0.3; font-weight:900; margin-top: 2px;">COLOMBO GMT+5:30</div>
                </div>
            </div>

            <div id="nodes-container"></div>

            <div class="advisory-wrapper">
                <div class="section-label">Infrastructure Advisories</div>
                <div class="admin-box" id="notes-content">Waiting for telemetry...</div>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const gmt530 = new Date(utc + (3600000 * 5.5));
            document.getElementById('clock').innerText = gmt530.toLocaleTimeString('en-GB', { hour12: false });
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function refreshStatus() {
            try {
                // Fetch telemetry export generated by GitHub Actions
                const res = await fetch(`./status.json?t=${Date.now()}`);
                if (!res.ok) throw new Error("status.json unavailable");
                const data = await res.json();

                document.getElementById('notes-content').innerText = data.notes || "All systems operational.";
                const container = document.getElementById('nodes-container');
                container.innerHTML = ''; 

                data.nodes.forEach(node => {
                    const nodeName = node.name;
                    const nodeLive = data.live.filter(i => i.node_name === nodeName).slice(0, 90).reverse();
                    const nodeDaily = data.daily.filter(i => i.node_name === nodeName).slice(0, 90).reverse();

                    // Live Pulse Uptime (Last 90 pings)
                    const upCountLive = nodeLive.filter(e => e.status === 'up').length;
                    const upPctLive = nodeLive.length > 0 ? ((upCountLive/nodeLive.length)*100).toFixed(2) : "100.00";

                    // 90-Day History Logic
                    let downDays = 0;
                    nodeDaily.forEach(day => {
                        if (parseFloat(day.minutes_offline) > 0) downDays++;
                    });
                    
                    const activeDayCount = nodeDaily.length || 1;
                    const upPctDaily = (((activeDayCount - downDays) / activeDayCount) * 100).toFixed(2);

                    const card = document.createElement('div');
                    card.className = 'monitor-card';

                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <h4 class="node-title">${nodeName}</h4>
                            </div>
                            <div class="uptime-val">${upPctLive}%</div>
                        </div>
                        
                        <div class="section-label" style="margin-top: 18px;">Live Pulse (Last 90 Checks)</div>
                        <div class="timeline" id="live-${node.id}"></div>
                        
                        <div class="section-header">
                            <span class="section-label">90-Day History Summary</span>
                            <span class="history-uptime-text" style="color: ${upPctDaily < 100 ? 'var(--down)' : 'var(--up)'}">${upPctDaily}%</span>
                        </div>
                        <div class="history-timeline" id="daily-${node.id}"></div>
                    `;
                    container.appendChild(card);

                    // Render Live Pulse
                    const liveBox = document.getElementById(`live-${node.id}`);
                    for(let i=0; i < 90; i++) {
                        const bar = document.createElement('div');
                        bar.className = 'bar';
                        const dIdx = i - (90 - nodeLive.length);
                        if(dIdx >= 0 && nodeLive[dIdx]) {
                            bar.classList.add(nodeLive[dIdx].status);
                            const t = new Date(nodeLive[dIdx].created_at).toLocaleTimeString();
                            bar.setAttribute('data-label', `PULSE: ${nodeLive[dIdx].status.toUpperCase()}\nTIME: ${t}`);
                        }
                        liveBox.appendChild(bar);
                    }

                    // Render 90-Day Bars
                    const dailyBox = document.getElementById(`daily-${node.id}`);
                    for(let i=0; i < 90; i++) {
                        const bar = document.createElement('div');
                        bar.className = 'bar';
                        const dIdx = i - (90 - nodeDaily.length);
                        if(dIdx >= 0 && nodeDaily[dIdx]) {
                            const day = nodeDaily[dIdx];
                            let dayStatus = 'up';
                            
                            if (parseFloat(day.minutes_offline) > 0) {
                                dayStatus = (day.final_status === 'maintenance') ? 'maintenance' : 'down';
                            }

                            bar.classList.add(dayStatus);
                            bar.setAttribute('data-label', `DATE: ${day.status_day}\nOFFLINE: ${day.minutes_offline}m\nSTATUS: ${dayStatus.toUpperCase()}`);
                        }
                        dailyBox.appendChild(bar);
                    }
                });

                const lastGlobal = data.live[0]?.status || 'up';
                const statusText = document.getElementById('status-text');
                statusText.innerText = lastGlobal === 'up' ? 'All Systems Operational' : 'Partial Infrastructure Outage';
                statusText.style.color = `var(--${lastGlobal})`;

            } catch (e) { console.error("Sync Error", e); }
        }

        refreshStatus();
        setInterval(refreshStatus, 30000);
    </script>
</body>
</html>
